<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ashtanga Yoga Log | 阿斯汤加打卡日历</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2b6cb0',
            success: '#38a169',
            warning: '#d69e2e',
            restDay: '#cbd5e0',
            moonDay: '#805ad5',
            missed: '#fc8181'
          }
        }
      }
    }
  </script>
  <style>
    .page { display: none; }
    .page.active { display: block; }
    .calendar-day { min-height:80px; }
    .collapsible-content { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
    .collapsible-content.open { max-height:2000px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
<div class="max-w-6xl mx-auto px-4 py-4">
  <!-- 顶部导航栏 -->
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-xl md:text-2xl font-bold text-primary" data-i18n="title">阿斯汤加瑜伽打卡</h1>
    <div class="flex gap-3 items-center">
      <!-- 语言切换 -->
      <div class="relative">
        <button id="langBtn" class="border rounded px-3 py-1 bg-white shadow text-sm">
          <i class="fa fa-globe"></i> <span id="langText">中文</span>
        </button>
        <div id="langDropdown" class="hidden absolute right-0 mt-1 bg-white border rounded shadow z-50">
          <div class="px-4 py-2 cursor-pointer hover:bg-gray-100" data-lang="zh">中文</div>
          <div class="px-4 py-2 cursor-pointer hover:bg-gray-100" data-lang="en">English</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Tab分页导航 -->
  <nav class="flex border-b mb-5 overflow-x-auto">
    <button data-tab="page-entry" class="tab-btn px-4 py-2 border-b-2 border-primary text-primary font-medium whitespace-nowrap" data-i18n="tabEntry">打卡录入</button>
    <button data-tab="page-stats" class="tab-btn px-4 py-2 border-b-2 border-transparent text-gray-600 whitespace-nowrap" data-i18n="tabStats">统计日历</button>
    <button data-tab="page-notes" class="tab-btn px-4 py-2 border-b-2 border-transparent text-gray-600 whitespace-nowrap" data-i18n="tabNotes">随笔总结</button>
  </nav>

  <!-- Page1:打卡录入页 -->
  <div id="page-entry" class="page active">
    <div class="bg-white rounded-lg shadow p-5 max-w-xl">
      <div class="mb-4">
        <label class="block mb-1 font-medium" data-i18n="labelDate">打卡日期</label>
        <input id="inputDate" type="date" class="w-full border rounded px-3 py-2"/>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium" data-i18n="labelDuration">练习时长(min)</label>
        <input id="inputDuration" type="number" min="1" class="w-full border rounded px-3 py-2"/>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium" data-i18n="labelSeries">练习序列</label>
        <select id="inputSeries" class="w-full border rounded px-3 py-2">
          <option value="primary" data-i18n="series1">一序列</option>
          <option value="intermediate" data-i18n="series2">二序列</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium" data-i18n="labelNoteType">随笔类型</label>
        <select id="inputNoteType" class="w-full border rounded px-3 py-2">
          <option value="muscleBone" data-i18n="typeMuscle">肌肉与骨骼</option>
          <option value="philosophy" data-i18n="typePhilosophy">瑜伽哲学</option>
          <option value="practice" data-i18n="typePractice">练习感悟</option>
          <option value="other" data-i18n="typeOther">其他</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium" data-i18n="labelEssay">随笔</label>
        <textarea id="inputEssay" rows="5" class="w-full border rounded px-3 py-2" placeholder="" data-i18n-placeholder="placeholderEssay"></textarea>
      </div>
      <button id="btnSaveLog" class="bg-primary text-white px-5 py-2 rounded shadow" data-i18n="btnSave">保存记录</button>
    </div>
  </div>

  <!-- Page2:统计日历页面 -->
  <div id="page-stats" class="page">
    <div class="bg-white rounded-lg shadow p-4">
      <div class="flex justify-between items-center mb-4">
        <div>
          <span id="statMonthTitle" class="text-lg font-semibold"></span>
        </div>
        <div class="flex gap-2">
          <button id="prevMonth" class="px-3 py-1 border rounded"><i class="fa fa-chevron-left"></i></button>
          <button id="nextMonth" class="px-3 py-1 border rounded"><i class="fa fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="mb-3 text-sm flex flex-wrap gap-x-4 gap-y-1">
        <span><span class="inline-block w-3 h-3 bg-success mr-1"></span><span data-i18n="legDone">已打卡</span></span>
        <span><span class="inline-block w-3 h-3 bg-restDay mr-1"></span><span data-i18n="legSunday">周日休息</span></span>
        <span><span class="inline-block w-3 h-3 bg-moonDay mr-1"></span><span data-i18n="legMoon">新月/满月</span></span>
        <span><span class="inline-block w-3 h-3 bg-missed mr-1"></span><span data-i18n="legMiss">应练未打卡</span></span>
      </div>
      <div class="mb-4 text-sm">
        <span data-i18n="statShould">本月应练习：</span><span id="statShouldCount">0</span>
        <span class="mx-2">|</span>
        <span data-i18n="statActual">实际打卡：</span><span id="statActualCount">0</span>
      </div>
      <div id="calendarWrap"></div>
      <!-- 单条记录弹窗 -->
      <div id="logModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded p-5 max-w-md w-full mx-4 max-h-[80vh] overflow-auto">
          <h3 class="font-bold mb-3" data-i18n="logDetail">打卡详情</h3>
          <div id="modalContent"></div>
          <div class="mt-4 flex gap-3 justify-end">
            <button id="modalClose" class="px-3 py-1 border rounded" data-i18n="close">关闭</button>
            <button id="modalDelete" class="px-3 py-1 bg-red-500 text-white rounded" data-i18n="delete">删除</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Page3：随笔总结（按类型折叠收纳） -->
  <div id="page-notes" class="page">
    <div class="bg-white rounded-lg shadow p-5">
      <h2 class="text-lg font-semibold mb-4" data-i18n="noteSummary">随笔总结</h2>
      <div id="notesContainer"></div>
    </div>
  </div>
</div>

<script>
// ========= I18N 中英文翻译 =========
const i18nData = {
  zh:{
    title:"阿斯汤加瑜伽打卡日历",
    tabEntry:"打卡录入",
    tabStats:"统计日历",
    tabNotes:"随笔总结",
    labelDate:"打卡日期",
    labelDuration:"练习时长(min)",
    labelSeries:"练习序列",
    series1:"一序列",
    series2:"二序列",
    labelNoteType:"随笔类型",
    typeMuscle:"肌肉与骨骼",
    typePhilosophy:"瑜伽哲学",
    typePractice:"练习感悟",
    typeOther:"其他",
    labelEssay:"随笔",
    placeholderEssay:"写下你的练习感受……",
    btnSave:"保存记录",
    legDone:"已打卡",
    legSunday:"周日休息",
    legMoon:"新月/满月",
    legMiss:"应练未打卡",
    statShould:"本月应练习：",
    statActual:"实际打卡：",
    logDetail:"打卡详情",
    close:"关闭",
    delete:"删除",
    noNotes:"暂无随笔记录",
    typeMuscleTitle:"肌肉与骨骼",
    typePhilosophyTitle:"瑜伽哲学",
    typePracticeTitle:"练习感悟",
    typeOtherTitle:"其他",
    seriesName:"练习序列",
    duration:"时长(min)",
    note:"随笔",
    confirmDel:"确定删除这条记录？",
    savedOk:"保存成功！"
  },
  en:{
    title:"Ashtanga Yoga Practice Log",
    tabEntry:"New Log",
    tabStats:"Calendar Stats",
    tabNotes:"Notes Summary",
    labelDate:"Log Date",
    labelDuration:"Duration(min)",
    labelSeries:"Practice Series",
    series1:"Primary Series",
    series2:"Intermediate Series",
    labelNoteType:"Note Category",
    typeMuscle:"Muscle & Skeleton",
    typePhilosophy:"Yoga Philosophy",
    typePractice:"Practice Reflection",
    typeOther:"Others",
    labelEssay:"Notes",
    placeholderEssay:"Write your practice reflections...",
    btnSave:"Save Log",
    legDone:"Completed",
    legSunday:"Sunday Rest",
    legMoon:"New/Full Moon",
    legMiss:"Missed Practice",
    statShould:"Should practice this month:",
    statActual:"Actual check‑ins:",
    logDetail:"Log Detail",
    close:"Close",
    delete:"Delete",
    noNotes:"No notes yet",
    typeMuscleTitle:"Muscle & Skeleton",
    typePhilosophyTitle:"Yoga Philosophy",
    typePracticeTitle:"Practice Reflection",
    typeOtherTitle:"Others",
    seriesName:"Series",
    duration:"Duration(min)",
    note:"Note",
    confirmDel:"Delete this log?",
    savedOk:"Saved successfully!"
  }
};
let currentLang = "zh";

// ========= 2026‑2028 满月新月日期（阿斯汤加非练习日） =========
const moonDaysRaw = [
  // 2026
  "2026-01-10","2026-01-25",
  "2026-02-09","2026-02-24",
  "2026-03-11","2026-03-26",
  "2026-04-09","2026-04-24",
  "2026-05-09","2026-05-23",
  "2026-06-07","2026-06-22",
  "2026-07-07","2026-07-21",
  "2026-08-05","2026-08-20",
  "2026-09-04","2026-09-18",
  "2026-10-04","2026-10-18",
  "2026-11-02","2026-11-17",
  "2026-12-02","2026-12-17",
  //2027
  "2027-01-01","2027-01-16",
  "2027-01-31","2027-02-15",
  "2027-03-02","2027-03-17",
  "2027-03-31","2027-04-16",
  "2027-04-30","2027-05-15",
  "2027-05-29","2027-06-14",
  "2027-06-28","2027-07-14",
  "2027-07-27","2027-08-12",
  "2027-08-26","2027-09-10",
  "2027-09-24","2027-10-10",
  "2027-10-24","2027-11-08",
  "2027-11-22","2027-12-08",
  "2027-12-22",
  //2028
  "2028-01-06","2028-01-21",
  "2028-02-05","2028-02-20",
  "2028-03-06","2028-03-20",
  "2028-04-04","2028-04-19",
  "2028-05-03","2028-05-18",
  "2028-06-02","2028-06-17",
  "2028-07-01","2028-07-16",
  "2028-07-31","2028-08-14",
  "2028-08-29","2028-09-13",
  "2028-09-27","2028-10-13",
  "2028-10-27","2028-11-11",
  "2028-11-25","2028-12-11",
  "2028-12-25"
];
const moonDaysSet = new Set(moonDaysRaw);

// 本地存储 key
const STORAGE_KEY = "ashtangaYogaLogs";
let logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

// 当前日历渲染年月
let displayYear = new Date().getFullYear();
let displayMonth = new Date().getMonth();

// 页面tab切换
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.onclick = ()=>{
    const tabId = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b=>{
      b.classList.remove("border-primary","text-primary");
      b.classList.add("border-transparent","text-gray-600");
    });
    btn.classList.add("border-primary","text-primary");
    btn.classList.remove("border-transparent","text-gray-600");
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(tabId).classList.add("active");
    if(tabId === "page-stats") renderCalendar();
    if(tabId === "page-notes") renderNotesSummary();
  }
});

// 语言切换下拉
const langBtn = document.getElementById("langBtn");
const langDropdown = document.getElementById("langDropdown");
langBtn.onclick = ()=> langDropdown.classList.toggle("hidden");
document.querySelectorAll("#langDropdown > div").forEach(el=>{
  el.onclick = ()=>{
    currentLang = el.dataset.lang;
    langDropdown.classList.add("hidden");
    applyI18n();
  }
});
document.body.onclick = (e)=>{
  if(!langBtn.contains(e.target) && !langDropdown.contains(e.target)) langDropdown.classList.add("hidden");
};

// 应用翻译
function applyI18n(){
  const dict = i18nData[currentLang];
  document.getElementById("langText").textContent = currentLang==="zh"?"中文":"English";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n;
    if(dict[k]) el.textContent = dict[k];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    const k = el.dataset.i18nPlaceholder;
    if(dict[k]) el.placeholder = dict[k];
  });
  // 更新下拉option文本
  const selSeries = document.getElementById("inputSeries");
  selSeries.options[0].textContent = dict.series1;
  selSeries.options[1].textContent = dict.series2;

  const selNoteType = document.getElementById("inputNoteType");
  selNoteType.options[0].textContent = dict.typeMuscle;
  selNoteType.options[1].textContent = dict.typePhilosophy;
  selNoteType.options[2].textContent = dict.typePractice;
  selNoteType.options[3].textContent = dict.typeOther;

  // 如果在统计页/随笔页重新渲染
  const activePage = document.querySelector(".page.active").id;
  if(activePage==="page-stats") renderCalendar();
  if(activePage==="page-notes") renderNotesSummary();
}

// 初始化表单默认今日、默认时长100，随笔类型默认练习感悟
function initForm(){
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,"0");
  const d = String(today.getDate()).padStart(2,"0");
  document.getElementById("inputDate").value = `${y}-${m}-${d}`;
  document.getElementById("inputDuration").value = 100;
  document.getElementById("inputNoteType").value = "practice";
}

// 保存打卡记录
document.getElementById("btnSaveLog").onclick = function(){
  const date = document.getElementById("inputDate").value;
  const duration = Number(document.getElementById("inputDuration").value) || 0;
  const series = document.getElementById("inputSeries").value;
  const noteType = document.getElementById("inputNoteType").value;
  const essay = document.getElementById("inputEssay").value.trim();
  if(!date){
    alert(currentLang==="zh"?"请选择日期":"Please select date");
    return;
  }
  const record = {
    id: Date.now(),
    date, duration, series, noteType, essay
  };
  logs.push(record);
  saveLogs();
  alert(i18nData[currentLang].savedOk);
  document.getElementById("inputEssay").value = "";
};

function saveLogs(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
}

// 获取某天的打卡记录
function getLogByDate(dStr){
  return logs.filter(r=>r.date === dStr);
}

// 判断是否周日
function isSunday(y,m,d){
  const dt = new Date(y,m,d);
  return dt.getDay() === 0;
}

// 判断是否新月满月日
function isMoonDay(dStr){
  return moonDaysSet.has(dStr);
}

// 判断是否应当练习日：不是周日，不是月相日
function isShouldPracticeDay(y,m,d){
  const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  if(isSunday(y,m,d)) return false;
  if(isMoonDay(ds)) return false;
  return true;
}

// 渲染日历
function renderCalendar(){
  const dict = i18nData[currentLang];
  const wrap = document.getElementById("calendarWrap");
  const firstDay = new Date(displayYear, displayMonth, 1);
  const lastDay = new Date(displayYear, displayMonth+1, 0);
  const firstWeekDay = firstDay.getDay(); //0周日
  const totalDays = lastDay.getDate();

  document.getElementById("statMonthTitle").textContent = `${displayYear}‑${displayMonth+1}`;

  // 计算本月应练习、实际打卡
  let shouldCount = 0;
  let actualCountSet = new Set();
  for(let d=1;d<=totalDays;d++){
    if(isShouldPracticeDay(displayYear, displayMonth, d)) shouldCount++;
    const ds = `${displayYear}-${String(displayMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    if(getLogByDate(ds).length>0) actualCountSet.add(ds);
  }
  document.getElementById("statShouldCount").textContent = shouldCount;
  document.getElementById("statActualCount").textContent = actualCountSet.size;

  // 星期表头
  const weekLabels = currentLang==="zh"
    ?["日","一","二","三","四","五","六"]
    :["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let html = `<div class="grid grid-cols-7 gap-1 mb-2">`;
  weekLabels.forEach(w=> html += `<div class="text-center font-medium py-1 text-sm bg-gray-100">${w}</div>`);
  html += `</div>`;

  html += `<div class="grid grid-cols-7 gap-1">`;
  // 前置空白格子
  for(let i=0;i<firstWeekDay;i++){
    html += `<div class="calendar-day bg-gray-50 border rounded"></div>`;
  }
  for(let d=1;d<=totalDays;d++){
    const ds = `${displayYear}-${String(displayMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const sunday = isSunday(displayYear, displayMonth, d);
    const moonDay = isMoonDay(ds);
    const shouldPractice = isShouldPracticeDay(displayYear, displayMonth, d);
    const dayLogs = getLogByDate(ds);
    const hasLog = dayLogs.length>0;

    let bgClass = "bg-white";
    if(sunday) bgClass = "bg-restDay";
    else if(moonDay) bgClass = "bg-moonDay text-white";
    else if(hasLog) bgClass = "bg-success text-white";
    else if(shouldPractice) bgClass = "bg-missed/40";

    html += `<div class="calendar-day border rounded p-1 cursor-pointer ${bgClass}" data-date="${ds}">
      <div class="font-bold">${d}</div>`;
    if(dayLogs.length>0){
      dayLogs.forEach(log=>{
        const seriesText = log.series==="primary"?dict.series1:dict.series2;
        html += `<div class="text-xs leading-tight">${seriesText} ${log.duration}min</div>`;
      })
    }
    html += `</div>`;
  }
  html += `</div>`;
  wrap.innerHTML = html;

  // 点击日期弹窗
  wrap.querySelectorAll(".calendar-day[data-date]").forEach(el=>{
    el.onclick = ()=>{
      const dateStr = el.dataset.date;
      const dayLogs = getLogByDate(dateStr);
      renderModal(dateStr, dayLogs);
    }
  })
}

let modalDeleteTargetId = null;
function renderModal(dateStr, dayLogs){
  const modal = document.getElementById("logModal");
  const content = document.getElementById("modalContent");
  const dict = i18nData[currentLang];
  modal.classList.remove("hidden");
  modalDeleteTargetId = null;
  if(dayLogs.length===0){
    content.innerHTML = `<p>${dateStr} ${currentLang==="zh"?"暂无打卡记录":"No logs"}</p>`;
    document.getElementById("modalDelete").style.display="none";
    return;
  }
  document.getElementById("modalDelete").style.display="inline-block";
  let h = `<div class="mb-2 font-medium">${dateStr}</div>`;
  dayLogs.forEach(log=>{
    h += `<div class="border-b py-2">
      <div><b>${dict.seriesName}:</b> ${log.series==="primary"?dict.series1:dict.series2}</div>
      <div><b>${dict.duration}:</b> ${log.duration} min</div>
      <button class="del‑log mt-2 px-2 py-1 bg-red-400 text-white rounded text-xs" data-id="${log.id}">${dict.delete}</button>
    </div>`;
  });
  content.innerHTML = h;
  content.querySelectorAll(".del‑log").forEach(btn=>{
    btn.onclick = ()=>{
      modalDeleteTargetId = Number(btn.dataset.id);
      if(confirm(dict.confirmDel)){
        logs = logs.filter(x=>x.id!==modalDeleteTargetId);
        saveLogs();
        renderCalendar();
        modal.classList.add("hidden");
      }
    }
  })
}

document.getElementById("modalClose").onclick = ()=>{
  document.getElementById("logModal").classList.add("hidden");
};

// 月份切换
document.getElementById("prevMonth").onclick = ()=>{
  displayMonth--;
  if(displayMonth<0){ displayMonth=11; displayYear--; }
  renderCalendar();
};
document.getElementById("nextMonth").onclick = ()=>{
  displayMonth++;
  if(displayMonth>11){ displayMonth=0; displayYear++; }
  renderCalendar();
};

// 随笔总结页面：按类型折叠分组
function renderNotesSummary(){
  const container = document.getElementById("notesContainer");
  const dict = i18nData[currentLang];
  const groups = {
    muscleBone:{ title:dict.typeMuscleTitle, list:[] },
    philosophy:{ title:dict.typePhilosophyTitle, list:[] },
    practice:{ title:dict.typePracticeTitle, list:[] },
    other:{ title:dict.typeOtherTitle, list:[] }
  };
  logs.forEach(r=>{
    if(r.essay && r.essay.trim()!==""){
      if(groups[r.noteType]) groups[r.noteType].list.push(r);
    }
  });
  let html = "";
  let hasAny = false;
  for(const key in groups){
    const g = groups[key];
    if(g.list.length===0) continue;
    hasAny = true;
    html += `<div class="mb-4 border rounded">
      <div class="collapsible-header px-3 py-2 bg-gray-100 cursor-pointer font-medium flex justify-between">
        <span>${g.title} (${g.list.length})</span>
        <i class="fa fa-chevron-down arrow"></i>
      </div>
      <div class="collapsible-content px-3 py-2">`;
    g.list.forEach(item=>{
      const seriesText = item.series==="primary"?dict.series1:dict.series2;
      html += `<div class="mb-3 pb-2 border-b">
        <div class="text-sm text-gray‑500">${item.date} · ${seriesText} · ${item.duration}min</div>
        <div class="mt-1 whitespace-pre-wrap">${escapeHtml(item.essay)}</div>
      </div>`;
    });
    html += `</div></div>`;
  }
  if(!hasAny){
    html = `<p class="text-gray‑500">${dict.noNotes}</p>`;
  }
  container.innerHTML = html;

  // 折叠展开事件
  container.querySelectorAll(".collapsible-header").forEach(hdr=>{
    hdr.onclick = ()=>{
      const content = hdr.nextElementSibling;
      const arrow = hdr.querySelector(".arrow");
      content.classList.toggle("open");
      if(content.classList.contains("open")){
        arrow.classList.remove("fa-chevron-down");
        arrow.classList.add("fa-chevron-up");
      }else{
        arrow.classList.remove("fa-chevron-up");
        arrow.classList.add("fa-chevron-down");
      }
    }
  })
}

function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 页面加载初始化
window.onload = function(){
  initForm();
  applyI18n();
}
</script>
