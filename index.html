<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习打卡日历 Ekadashi标记</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:600px;margin:12px auto;padding:0 8px;}
.calendar-wrap{margin-top:16px;}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.calendar-day{aspect-ratio:1/1;border:1px solid #ddd;padding:2px;font-size:12px;position:relative;}
.calendar-day.other-month{color:#aaa;background:#f8f8f8;}
.ekadashi-day{background-color:#fff2f2 !important;}
.ekadashi-mark{position:absolute;top:2px;right:2px;font-size:10px;color:#c00;font-weight:bold;}
.dur{color:#069;font-weight:500;}
.seq{color:#444;}
.form-item{margin:8px 0;}
input,select{width:100%;padding:6px;font-size:14px;}
button{padding:8px 12px;cursor:pointer;}
</style>
</head>
<body>
<h2>练习打卡</h2>
<div class="form-wrap">
  <div class="form-item">
    <label>日期</label>
    <input type="date" id="logDate">
  </div>
  <div class="form-item">
    <label>练习时长(min)</label>
    <input type="number" id="practiceMin" value="100" min="1">
  </div>
  <div class="form-item">
    <label>练习序列</label>
    <input type="text" id="series" placeholder="例如A">
  </div>
  <div class="form-item">
    <label>随笔类型</label>
    <select id="noteType">
      <option value="练习感悟" selected>练习感悟</option>
      <option value="问题记录">问题记录</option>
    </select>
  </div>
  <div class="form-item">
    <label>随笔</label>
    <textarea id="note" style="width:100%;height:60px;"></textarea>
  </div>
  <button id="saveBtn">保存打卡</button>
</div>

<div class="calendar-wrap">
  <div class="calendar-header">
    <button id="prevMonth">&lt;</button>
    <span id="calTitle"></span>
    <button id="nextMonth">&gt;</button>
  </div>
  <div class="calendar-grid" id="calendarBox"></div>
</div>

<script>
// localstorage key
const STORAGE_KEY = "practiceLog";
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

// load data
function loadAll(){
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : {};
}
function saveAll(obj){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
}

/**
 * 获取当月 Ekadashi 十一斋日：新月后第11天、满月后第11天
 * @param {number} year
 * @param {number} month 0‑11 JS月份
 * @returns {number[]} 当月几号数组
 */
function getEkadashiDaysOfMonth(year, month) {
  const baseNewMoon = new Date(2026, 7, 4);
  const lunarCycleMs = 29.53 * 24 * 3600 * 1000;
  const result = [];
  const startOfMonth = new Date(year, month, 1);
  const endOfMonth = new Date(year, month + 1, 0);
  for (let i = -2; i < 4; i++) {
    const newMoon = new Date(baseNewMoon.getTime() + i * lunarCycleMs);
    const fullMoon = new Date(newMoon.getTime() + lunarCycleMs / 2);

    const ekadashi1 = new Date(newMoon);
    ekadashi1.setDate(newMoon.getDate() + 11);
    if (ekadashi1 >= startOfMonth && ekadashi1 <= endOfMonth) {
      result.push(ekadashi1.getDate());
    }

    const ekadashi2 = new Date(fullMoon);
    ekadashi2.setDate(fullMoon.getDate() + 11);
    if (ekadashi2 >= startOfMonth && ekadashi2 <= endOfMonth) {
      result.push(ekadashi2.getDate());
    }
  }
  return [...new Set(result)].sort((a, b) => a - b);
}

function renderCalendar(){
  const box = document.getElementById("calendarBox");
  box.innerHTML="";
  // week header
  const weekNames=["日","一","二","三","四","五","六"];
  weekNames.forEach(w=>{
    const el=document.createElement("div");
    el.className="calendar-day";
    el.innerText=w;
    box.appendChild(el);
  })

  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth+1, 0);
  const firstWeekDay = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const prevMonthLast = new Date(calYear, calMonth, 0).getDate();

  const ekadashiList = getEkadashiDaysOfMonth(calYear, calMonth);
  const records = loadAll();

  // 上月剩余
  for(let i=0;i<firstWeekDay;i++){
    const d = prevMonthLast - firstWeekDay + i + 1;
    const el=document.createElement("div");
    el.className="calendar-day other-month";
    el.innerText=d;
    box.appendChild(el);
  }

  // 当月日期
  for(let day=1;day<=totalDays;day++){
    const dateKey = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const record = records[dateKey];
    const isEkadashi = ekadashiList.includes(day);

    const el=document.createElement("div");
    el.className="calendar-day";
    if(isEkadashi){
      el.classList.add("ekadashi-day");
      el.title = "十一斋日，完全不进食或只饮水";
      const mark = document.createElement("span");
      mark.className="ekadashi-mark";
      mark.innerText="⑪斋";
      el.appendChild(mark);
    }
    el.innerHTML += `<div>${day}</div>`;
    if(record){
      el.innerHTML += `<div class='dur'>${record.practiceMin}min</div><div class='seq'>序列${record.series||'-'}</div>`;
      // 不渲染随笔内容
    }
    box.appendChild(el);
  }

  document.getElementById("calTitle").innerText = `${calYear}年${calMonth+1}月`;
}

// save log
document.getElementById("saveBtn").onclick=()=>{
  const logDate = document.getElementById("logDate").value;
  const practiceMin = Number(document.getElementById("practiceMin").value);
  const series = document.getElementById("series").value.trim();
  const noteType = document.getElementById("noteType").value;
  const note = document.getElementById("note").value.trim();
  if(!logDate){alert("请选择日期");return;}
  const all = loadAll();
  all[logDate]={logDate,practiceMin,series,noteType,note};
  saveAll(all);
  alert("已保存");
  // 刷新日历，如果保存的是当前显示月份
  const d = new Date(logDate);
  calYear = d.getFullYear();
  calMonth = d.getMonth();
  renderCalendar();
}

document.getElementById("prevMonth").onclick=()=>{
  calMonth--;
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
document.getElementById("nextMonth").onclick=()=>{
  calMonth++;
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

// init
{
  const today=new Date();
  const y=today.getFullYear();
  const m=String(today.getMonth()+1).padStart(2,'0');
  const d=String(today.getDate()).padStart(2,'0');
  document.getElementById("logDate").value=`${y}-${m}-${d}`;
}
renderCalendar();
</script>
</body>
</html>
